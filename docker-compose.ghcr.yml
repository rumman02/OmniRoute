# ──────────────────────────────────────────────────────────────────────
#  OmniRoute — GHCR tier images (no local build)
# ──────────────────────────────────────────────────────────────────────
#
#  Runs the pre-built images from ghcr.io/rumman02/omniroute, built by
#  .github/workflows/ghcr-tier-images.yml. Pick a tier with OMNIROUTE_TIER:
#
#    base          minimal — no browsers, no CLI tools
#    web           +Chromium/Playwright for web-cookie providers
#    web-cli       +CLIs (@openai/codex, claude-code, droid, openclaw) + git/docker
#    web-cli-host  +host-mode defaults (mount your host CLI binaries/configs —
#                  see the volumes block below; without the mounts the baked-in
#                  CLIs are still used, the host lookup just misses)
#    full          +codex-app-server role entrypoint (OMNIROLE, see below)
#
#  Usage:
#    cp .env.example .env   # then edit your secrets
#    docker compose -f docker-compose.ghcr.yml up -d                      # base
#    OMNIROUTE_TIER=web-cli docker compose -f docker-compose.ghcr.yml up -d
#
#  Additional compose profiles (orthogonal to the image tier):
#    web-cookie        adds the chatgpt-web-codex-browser Chromium sidecar (CDP)
#    codex-app-server  adds the codex app-server sidecar on ws://codex-app-server:1456
#
#    OMNIROUTE_TIER=full docker compose -f docker-compose.ghcr.yml \
#      --profile codex-app-server up -d
#
#  `full` can also run the sidecar role directly (no separate service):
#    docker run -e OMNIROLE=codex-app-server ghcr.io/rumman02/omniroute:full
# ──────────────────────────────────────────────────────────────────────

x-common: &common
  restart: unless-stopped
  stop_grace_period: 40s
  env_file: .env
  environment:
    - DATA_DIR=/app/data # Must match the volume mount below
    - PORT=${PORT:-20128}
    - DASHBOARD_PORT=${DASHBOARD_PORT:-20128}
    - API_PORT=${API_PORT:-20129}
    - API_HOST=${API_HOST:-0.0.0.0}
    - LIVE_WS_PORT=${LIVE_WS_PORT:-20132}
    - LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}
    - LIVE_WS_ALLOWED_ORIGINS=${LIVE_WS_ALLOWED_ORIGINS:-http://localhost:20128,http://127.0.0.1:20128}
    - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    - NODE_OPTIONS=--max-old-space-size=2048
    # Codex App-Server transport (provider: codex-app-server). Inert unless the
    # `codex-app-server` compose profile is up (the sidecar below).
    - OMNIROUTE_CODEX_APPSERVER_WS=${OMNIROUTE_CODEX_APPSERVER_WS:-ws://codex-app-server:1456}
    - OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE=${OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE:-/run/codex-appserver/token}
    # Internal Chromium sidecar for ChatGPT Web (Codex) — used by the `web`
    # tiers together with the `web-cookie` profile.
    - CHATGPT_WEB_CODEX_CDP_URL=${CHATGPT_WEB_CODEX_CDP_URL:-http://chatgpt-web-codex-browser:9223}
  volumes:
    - ./data:/app/data
    # Shared capability token + codex auth for the app-server WS. Only meaningful
    # when the codex-app-server profile is active.
    - codex-appserver-token:/run/codex-appserver
    - codex-appserver-home:/home/node/.codex
  healthcheck:
    test: ["CMD", "node", "healthcheck.mjs"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s

services:
  # ── Redis (Rate Limiter Backend) ──────────────────────────────────
  redis:
    image: docker.io/library/redis:8.6.5-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    ports:
      # Loopback-only by default: this Redis has no `requirepass` (same policy
      # as docker-compose.yml — see its comment before publishing more widely).
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── OmniRoute app (tier selected via OMNIROUTE_TIER) ──────────────
  omniroute:
    <<: *common
    image: ghcr.io/rumman02/omniroute:${OMNIROUTE_TIER:-base}
    container_name: omniroute
    ports:
      - "${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}"
      - "${API_PORT:-20129}:${API_PORT:-20129}"
      - "${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    # ── Host-mode mounts (web-cli-host tier) ──
    # Only needed when OMNIROUTE_TIER=web-cli-host. Adjust the paths to YOUR
    # host system (mirrors the `host` profile of docker-compose.yml):
    # volumes:
    #   - ./data:/app/data
    #   - ~/.local/bin:/host-local/bin:ro
    #   - ~/.nvm/versions/node/v24.14.1/bin:/host-node/bin:ro
    #   - ~/.codex:/host-home/.codex:rw
    #   - ~/.claude:/host-home/.claude:rw
    #   - ~/.factory:/host-home/.factory:rw
    #   - ~/.openclaw:/host-home/.openclaw:rw
    #   - ~/.cursor:/host-home/.cursor:rw
    #   - ~/.config/cursor:/host-home/.config/cursor:rw

  # ── Profile: web-cookie (Chromium sidecar for ChatGPT Web/Codex) ──
  chatgpt-web-codex-browser:
    image: ghcr.io/rumman02/omniroute:chatgpt-web-codex-browser
    restart: unless-stopped
    shm_size: "2gb"
    volumes:
      - chatgpt-web-codex-browser-data:/browser-profile
    profiles:
      - web-cookie

  # ── Profile: codex-app-server (Codex CLI app-server sidecar) ──────
  # Same `full` image, switched to its codex-app-server role by OMNIROLE
  # (the role entrypoint mirrors the command of the upstream compose profile:
  # token minting + `codex app-server --listen ws://0.0.0.0:1456`).
  codex-app-server:
    image: ghcr.io/rumman02/omniroute:full
    container_name: omniroute-codex-app-server
    restart: unless-stopped
    environment:
      - OMNIROLE=codex-app-server
      - CODEX_HOME=/home/node/.codex
      - RUST_LOG=${CODEX_APPSERVER_RUST_LOG:-warn}
    volumes:
      - codex-appserver-token:/run/codex-appserver
      - codex-appserver-home:/home/node/.codex
    # No `ports:` — internal-only. Reached at ws://codex-app-server:1456 over the
    # compose network by the omniroute app.
    healthcheck:
      test:
        ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1456/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - codex-app-server

volumes:
  chatgpt-web-codex-browser-data:
    name: omniroute-chatgpt-web-codex-browser-data
  redis-data:
    name: omniroute-redis-data
  codex-appserver-token:
    name: omniroute-codex-appserver-token
  codex-appserver-home:
    name: omniroute-codex-appserver-home
